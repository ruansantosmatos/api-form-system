Section:
  type: object
  properties:
    id:
      type: integer
      example: 1
    form_id:
      type: integer
    title:
      type: string
      nullable: true
      maxLength: 150
    description:
      type: string
      nullable: true
    order:
      type: integer
    created_at:
      type: string
      format: date-time
      nullable: true
    updated_at:
      type: string
      format: date-time
      nullable: true

SectionWithFields:
  allOf:
    - $ref: '#/Section'
    - type: object
      properties:
        fields:
          type: array
          items:
            $ref: '../schemas/field.yaml#/Field'

CreateSectionRequest:
  type: object
  required: [order]
  properties:
    title:
      type: string
      minLength: 1
      maxLength: 150
    description:
      type: string
      maxLength: 150
    order:
      type: integer
      minimum: 0

UpdateSectionItem:
  type: object
  required: [id]
  properties:
    id:
      type: integer
      minimum: 1
    title:
      type: string
      minLength: 1
      maxLength: 150
    description:
      type: string
      maxLength: 150
    order:
      type: integer
      minimum: 0

UpdateSectionsRequest:
  type: object
  required: [sections]
  properties:
    sections:
      type: array
      minItems: 1
      items:
        $ref: '#/UpdateSectionItem'
