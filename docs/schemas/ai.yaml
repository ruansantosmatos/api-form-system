AiModel:
  type: object
  description: A model offered by a provider. The catalog is seeded by the application — users cannot create models.
  properties:
    id:
      type: integer
      example: 5
    slug:
      type: string
      description: The identifier sent to the provider's API.
      example: claude-opus-5
    name:
      type: string
      example: Claude Opus 5
    description:
      type: string
      nullable: true
    context_window:
      type: integer
      description: Maximum number of input tokens the model accepts.
      example: 1000000
    max_output_tokens:
      type: integer
      description: Ceiling for max_output_tokens in the user's config for this model.
      example: 128000
    input_cost_per_million:
      type: number
      description: USD per 1 million input tokens, so the UI can show what a model costs before it is chosen.
      example: 5
    output_cost_per_million:
      type: number
      description: USD per 1 million output tokens.
      example: 25
    supports_temperature:
      type: boolean
      description: When false, sending a temperature in the model config is rejected with 400.
    is_default:
      type: boolean
      description: Recommended model within its provider.
    is_in_use:
      type: boolean
      description: Whether this is the single model currently in use by the authenticated user.

AiCredential:
  type: object
  description: The user's API key for a provider. The key itself is stored encrypted and never returned.
  properties:
    id:
      type: integer
      example: 3
    provider_id:
      type: integer
      example: 2
    provider_slug:
      type: string
      example: anthropic
    provider_name:
      type: string
      example: Anthropic
    label:
      type: string
      nullable: true
      description: Optional name to help the user tell keys apart.
      example: Chave pessoal
    masked_api_key:
      type: string
      description: Only the last four characters of the key are ever exposed.
      example: '****a1b2'
    last_used_at:
      type: string
      format: date-time
      nullable: true
    created_at:
      type: string
      format: date-time
      nullable: true
    updated_at:
      type: string
      format: date-time
      nullable: true

AiProvider:
  type: object
  description: A provider plus its active models and the authenticated user's credential for it.
  properties:
    id:
      type: integer
      example: 2
    slug:
      type: string
      example: anthropic
    name:
      type: string
      example: Anthropic
    description:
      type: string
      nullable: true
    website_url:
      type: string
      nullable: true
      example: https://platform.claude.com
    credential:
      allOf:
        - $ref: './ai.yaml#/AiCredential'
      nullable: true
      description: Null until the user adds an API key for this provider.
    models:
      type: array
      items:
        $ref: './ai.yaml#/AiModel'

UpsertCredentialRequest:
  type: object
  required: [api_key]
  properties:
    api_key:
      type: string
      minLength: 20
      maxLength: 250
      description: >
        Validated against the provider's key format only — it is not sent to the provider on save,
        so an incorrect-but-well-formed key is only detected when the model is actually used.
      example: sk-ant-api03-xxxxxxxxxxxxxxxxxxxx
    label:
      type: string
      maxLength: 80
      example: Chave pessoal

AiModelConfig:
  type: object
  description: The authenticated user's settings for one model. Created on first activation or first config update.
  properties:
    id:
      type: integer
    model_id:
      type: integer
      example: 5
    model_slug:
      type: string
      example: claude-opus-5
    model_name:
      type: string
      example: Claude Opus 5
    provider_id:
      type: integer
      example: 2
    provider_slug:
      type: string
      example: anthropic
    max_output_tokens:
      type: integer
      description: Defaults to the model's ceiling; cannot exceed it.
      example: 8192
    temperature:
      type: number
      nullable: true
      minimum: 0
      maximum: 2
    top_p:
      type: number
      nullable: true
      minimum: 0
      maximum: 1
    frequency_penalty:
      type: number
      nullable: true
      minimum: -2
      maximum: 2
    presence_penalty:
      type: number
      nullable: true
      minimum: -2
      maximum: 2
    system_prompt:
      type: string
      nullable: true
      maxLength: 20000
    is_active:
      type: boolean
      description: True for the single model currently in use.
    created_at:
      type: string
      format: date-time
      nullable: true
    updated_at:
      type: string
      format: date-time
      nullable: true

AiActiveModelResponse:
  type: object
  description: Wrapper so "no model in use" is an explicit null instead of an empty body.
  properties:
    active_model:
      allOf:
        - $ref: './ai.yaml#/AiModelConfig'
      nullable: true

UpdateModelConfigRequest:
  type: object
  description: Partial update — at least one field must be provided.
  properties:
    max_output_tokens:
      type: integer
      minimum: 1
      description: Rejected with 400 when above the model's max_output_tokens.
      example: 8192
    temperature:
      type: number
      nullable: true
      minimum: 0
      maximum: 2
      description: Rejected with 400 when the model has supports_temperature false.
    top_p:
      type: number
      nullable: true
      minimum: 0
      maximum: 1
    frequency_penalty:
      type: number
      nullable: true
      minimum: -2
      maximum: 2
    presence_penalty:
      type: number
      nullable: true
      minimum: -2
      maximum: 2
    system_prompt:
      type: string
      nullable: true
      maxLength: 20000
